# tmux for the phone terminal's persistent session (pi-term.service, socket `-L jarvis`).
# Mouse on: a swipe on the phone arrives as wheel events, which tmux turns into scrollback.
set -g mouse on
set -g history-limit 50000
set -g status off
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# The screen that attached last (the phone) sets the size.
set -g window-size latest
set -g focus-events on
